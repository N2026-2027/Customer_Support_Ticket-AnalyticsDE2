version: 2

sources:
  - name: raw_data
    # En esta versión, dbt buscaba todo en el esquema main
    schema: main
    description: "Fuentes de datos crudos unificadas"
    tables:
      - name: customer_support_tickets
        description: "Dataset original de Kaggle"
      - name: customer_support_tickets_200k
        description: "Dataset sintético de 200k registros"

  - name: raw_200k
    # Importante: dbt-duckdb usa 'main_raw' por defecto cuando 
    # el esquema en dbt_project.yml se define como 'raw' para los seeds.
    schema: main
    description: "Dataset de 200k registros recuperado vía dbt seed"
    tables:
      - name: customer_support_tickets_200k
        description: "Tabla principal de tickets con 200.000 filas"
        columns:
          - name: ticket_id
            tests:
              - not_null
              - unique

  - name: raw_original
    # Este es el esquema para el dataset pequeño original
    schema: main
    tables:
      - name: customer_support_tickets
        description: "Dataset original de 8.000 registros"